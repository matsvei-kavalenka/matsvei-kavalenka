<svg xmlns="http://www.w3.org/2000/svg" width="840" height="320" viewBox="0 0 840 320" role="img" aria-labelledby="title desc">
  <title id="title">Matsvei Kavalenka · AI Engineer</title>
  <desc id="desc">A hard court seen from above. A ball crosses the net and lands deep, right next to the baseline, under a crosshair.</desc>
  <style>
    .sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Helvetica,Arial,sans-serif}
    .mono{font-family:ui-monospace,SFMono-Regular,"JetBrains Mono",Menlo,Consolas,"Liberation Mono",monospace}
    .ln{stroke:#ffffff;stroke-opacity:.24;stroke-width:2;fill:none}
  </style>
  <defs>
    <clipPath id="card"><rect width="840" height="320" rx="16"/></clipPath>
    <linearGradient id="veil" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0B1A30" stop-opacity=".9"/>
      <stop offset=".38" stop-color="#0B1A30" stop-opacity=".6"/>
      <stop offset=".6" stop-color="#0B1A30" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="spot" cx="790" cy="200" r="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#DFFF4F" stop-opacity=".11"/>
      <stop offset="1" stop-color="#DFFF4F" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ballfill" cx=".35" cy=".35" r=".75">
      <stop offset="0" stop-color="#F2FF9E"/>
      <stop offset=".6" stop-color="#DFFF4F"/>
      <stop offset="1" stop-color="#B9D62E"/>
    </radialGradient>
  </defs>

  <g clip-path="url(#card)">
    <!-- run-off + court surface -->
    <rect width="840" height="320" fill="#0E2442"/>
    <rect x="40" y="-16" width="760" height="352" fill="#16345C"/>
    <rect width="840" height="320" fill="url(#spot)"/>

    <!-- court lines -->
    <g class="ln">
      <line x1="40" y1="-20" x2="40" y2="340"/>
      <line x1="800" y1="-20" x2="800" y2="340"/>
      <line x1="40" y1="28" x2="800" y2="28"/>
      <line x1="40" y1="292" x2="800" y2="292"/>
      <line x1="215" y1="28" x2="215" y2="292"/>
      <line x1="625" y1="28" x2="625" y2="292"/>
      <line x1="215" y1="160" x2="625" y2="160"/>
      <line x1="40" y1="160" x2="52" y2="160"/>
      <line x1="788" y1="160" x2="800" y2="160"/>
    </g>

    <!-- net -->
    <rect x="417" y="-20" width="12" height="360" fill="#000" opacity=".14"/>
    <line x1="420" y1="-20" x2="420" y2="340" stroke="#ffffff" stroke-opacity=".1" stroke-width="12" stroke-dasharray="1 4"/>
    <line x1="420" y1="-20" x2="420" y2="340" stroke="#E8EEF6" stroke-opacity=".6" stroke-width="3"/>

    <!-- legibility veil -->
    <rect width="840" height="320" fill="url(#veil)"/>

    <!-- text -->
    <text x="72" y="88" class="mono" font-size="13" letter-spacing="3.5" fill="#DFFF4F">AI ENGINEER</text>
    <text x="68" y="146" class="sans" font-size="56" font-weight="800" letter-spacing="-1.5" fill="#F3F6FA">Matsvei</text>
    <text x="68" y="204" class="sans" font-size="56" font-weight="800" letter-spacing="-1.5" fill="#F3F6FA">Kavalenka</text>
    <text x="72" y="240" class="sans" font-size="16" fill="#A9BBD1">RAG · GraphRAG · LLM evaluation</text>

    <!-- trajectory -->
    <path d="M360 340 Q590 -30 790 200 L880 304" fill="none" stroke="#DFFF4F" stroke-opacity=".4" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="0.1 9"/>

    <!-- bounce mark + crosshair -->
    <ellipse cx="790" cy="200" rx="6" ry="4" fill="#DFFF4F" opacity=".25"/>
    <circle cx="790" cy="200" r="3" fill="none" stroke="#DFFF4F" stroke-width="2">
      <animate attributeName="r" values="3;3;3;28;28" keyTimes="0;.449;.45;.66;1" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0;.9;0;0" keyTimes="0;.449;.45;.66;1" dur="5s" repeatCount="indefinite"/>
    </circle>
    <g stroke="#DFFF4F" stroke-width="2" opacity=".9">
      <line x1="773" y1="200" x2="783" y2="200"/>
      <line x1="797" y1="200" x2="807" y2="200"/>
      <line x1="790" y1="183" x2="790" y2="193"/>
      <line x1="790" y1="207" x2="790" y2="217"/>
    </g>
    <text x="812" y="190" class="mono" font-size="11" font-weight="700" letter-spacing="1" fill="#DFFF4F" opacity=".85">IN</text>

    <!-- ball + ground shadow -->
    <ellipse rx="7" ry="3.5" fill="#000" opacity=".35">
      <animateMotion path="M360 340 L790 200 L880 304" dur="5s" repeatCount="indefinite" calcMode="linear" keyPoints="0;.7668;1;1" keyTimes="0;.45;.62;1"/>
    </ellipse>
    <g>
      <animateMotion path="M360 340 Q590 -30 790 200 L880 304" dur="5s" repeatCount="indefinite" calcMode="linear" keyPoints="0;.8016;1;1" keyTimes="0;.45;.62;1"/>
      <circle r="14" fill="#DFFF4F" opacity=".14"/>
      <circle r="7.5" fill="url(#ballfill)"/>
      <path d="M-5.5 -4.5 Q0 0 -5.5 4.5 M5.5 -4.5 Q0 0 5.5 4.5" fill="none" stroke="#ffffff" stroke-opacity=".8" stroke-width="1.2"/>
    </g>
  </g>
  <rect x=".5" y=".5" width="839" height="319" rx="15.5" fill="none" stroke="#ffffff" stroke-opacity=".07"/>
</svg>
